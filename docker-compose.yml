services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: '["http://localhost:8501"]'
    volumes: [ "meeting_data:/data" ]
    ports: [ "8000:8000" ]
    restart: unless-stopped
  ui:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: [ "8501:8501" ]
    restart: unless-stopped
volumes:
  meeting_data:
